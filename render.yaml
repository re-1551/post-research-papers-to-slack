services:
  # Discord Bot（常駐・ボタンインタラクション処理用）
  - type: web
    name: discord-arxiv-bot
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: DISCORD_CHANNEL_ID
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: NODE_ENV
        value: production
      - key: TZ
        value: Asia/Tokyo
    autoDeploy: true
    region: oregon

  # 毎朝6時（JST）のダイジェスト投稿用Cron Job
  # 注意: RenderのCron JobはUTCで動作するため、JST 6:00 = UTC 21:00
  - type: cron
    name: daily-digest-cron
    env: node
    plan: free
    schedule: "0 21 * * *"  # 毎日 21:00 UTC = 06:00 JST
    buildCommand: npm install && npm run build
    startCommand: npm run digest
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: DISCORD_CHANNEL_ID
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: NODE_ENV
        value: production
      - key: TZ
        value: Asia/Tokyo
    autoDeploy: true
    region: oregon
