services:
  # Discord Bot（常駐・ボタンインタラクション処理 + HTTPトリガー受付）
  - type: web
    name: discord-arxiv-bot
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: DISCORD_CHANNEL_ID
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: TRIGGER_SECRET
        sync: false
      - key: NODE_ENV
        value: production
      - key: TZ
        value: Asia/Tokyo
      - key: PORT
        value: "10000"
    autoDeploy: true
    region: oregon
